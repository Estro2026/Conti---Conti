# Pubblica su GitHub Pages solo mockup e wireframe (docs/03-design/mockup e docs/03-design/wireframe).
# I materiali del cliente (docs/00-input e le altre analisi) NON vengono pubblicati.
# Attivazione una tantum (fatta): Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Pubblica mockup e wireframe

on:
  push:
    branches: [main]
    paths:
      - "docs/03-design/mockup/**"
      - "docs/03-design/wireframe/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara il sito (solo mockup e wireframe)
        run: |
          mkdir -p _site
          cp -r docs/03-design/mockup _site/mockup
          cp -r docs/03-design/wireframe _site/wireframe
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="it"><head><meta charset="utf-8"><meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=mockup/home-a.html">
          <title>Conti &amp; Conti | Mockup e wireframe</title></head>
          <body><p>Mockup e wireframe in revisione: <a href="mockup/home-a.html">Homepage A</a> · <a href="mockup/home-b.html">Homepage B</a> · <a href="wireframe/index.html">Indice wireframe</a></p></body></html>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
